# Ambuja Desk — issuetracker.ambujaneotia.com
# Install: sudo cp ambuja_desk.nginx.conf /etc/nginx/sites-available/ambuja_desk
#          sudo ln -s /etc/nginx/sites-available/ambuja_desk /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d issuetracker.ambujaneotia.com

server {
    listen 80;
    listen [::]:80;
    server_name issuetracker.ambujaneotia.com;

    client_max_body_size 50M;

    root /home/srvadmin/ambuja_desk/ambuja_desk/frontend/dist;
    index index.html;

    access_log /var/log/nginx/ambuja_desk.access.log;
    error_log  /var/log/nginx/ambuja_desk.error.log;

    # ---- React SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite build assets are immutable
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or users get a stale bundle after a redeploy
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ---- Flask API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8015;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;   # stream large ticket attachments straight through
    }

    # ---- Ticket attachments ----
    # Served straight off disk; the Flask /uploads/<file> route stays as a fallback.
    location /uploads/ {
        alias /home/srvadmin/ambuja_desk/ambuja_desk/backend/data/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "private";
        try_files $uri @flask_uploads;
    }

    location @flask_uploads {
        proxy_pass http://127.0.0.1:8015;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never hand out .env, .py sources or anything dot-prefixed
    location ~ /\. {
        deny all;
    }
}
